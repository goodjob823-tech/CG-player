name: Add complete offline mode

on:
  push:
    paths:
      - '.github/workflows/fix-cg02-mobile-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add offline UI
        shell: python
        run: |
          from pathlib import Path
          import base64

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '<script id="offline-library-v1">'
          encoded = ''

          if marker not in text:
              block = base64.b64decode(encoded).decode('utf-8')
              text = text.replace('</body>', block + '\n</body>', 1)

          assert marker in text
          assert 'offlineLibraryBtn' in text
          assert 'DOWNLOAD_OFFLINE' in text
          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Add complete offline download and update controls"
          git push
