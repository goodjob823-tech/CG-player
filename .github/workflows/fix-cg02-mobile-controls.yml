name: Make CG asset loading reliable

on:
  push:
    paths:
      - '.github/workflows/fix-cg02-mobile-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch lazy loader
        shell: python
        run: |
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          start = text.index('function loadScriptOnce(src){')
          end = text.index('function cgAssetScript', start)
          lines = [
              "function loadScriptOnce(src){",
              "  if(scriptLoads.has(src))return scriptLoads.get(src);",
              "  const p=new Promise((resolve,reject)=>{",
              "    let attempt=0;",
              "    const maxAttempts=3;",
              "    const run=()=>{",
              "      attempt++;",
              "      const s=document.createElement('script');",
              "      const version=(src==='assets_cg02.js')?'?v=20260908-cg02fix3':'';",
              "      s.src=src+version;",
              "      s.async=true;",
              "      s.onload=()=>resolve(src);",
              "      s.onerror=()=>{",
              "        try{s.remove()}catch(e){}",
              "        if(attempt<maxAttempts){setTimeout(run,500*attempt);return;}",
              "        reject(new Error(`無法下載 ${src}（已重試 ${maxAttempts} 次）`));",
              "      };",
              "      document.head.appendChild(s);",
              "    };",
              "    run();",
              "  });",
              "  scriptLoads.set(src,p);",
              "  p.catch(()=>scriptLoads.delete(src));",
              "  return p;",
              "}",
              "",
          ]
          new_func = '\n'.join(lines)
          text = text[:start] + new_func + text[end:]
          assert "const version=(src==='assets_cg02.js')?'?v=20260908-cg02fix3':'';" in text
          assert 'const maxAttempts=3;' in text
          assert 'p.catch(()=>scriptLoads.delete(src));' in text
          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Retry failed CG pack downloads and stop cache-busting CG01"
          git push
