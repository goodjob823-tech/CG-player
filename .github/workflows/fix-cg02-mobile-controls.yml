name: Restore stable player

on:
  push:
    paths:
      - '.github/workflows/fix-cg02-mobile-controls.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore last stable player files
        run: |
          git show 2f742e2061584eb2c719e893d72d541e35525058:index.html > index.html
          git show 2f742e2061584eb2c719e893d72d541e35525058:sw.js > sw.js

      - name: Commit restore
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sw.js
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore stable playback before offline-mode changes"
          git push
