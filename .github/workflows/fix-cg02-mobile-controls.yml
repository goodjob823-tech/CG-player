name: Fix CG02 upper-left shadow

on:
  push:
    paths:
      - '.github/workflows/fix-cg02-mobile-controls.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync latest main
        run: git pull --rebase origin main

      - name: Patch CG02 upper-left shadow
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          old = """      player=p;if(cg!=='CG02')installHighQualityRenderer(p);else{for(const n of ['LP_penis_shadow','RP_penis_shadow']){try{const s=p.skeleton.findSlot(n);if(s&&s.data&&spine.BlendMode)s.data.blendMode=spine.BlendMode.Multiply}catch(e){}}}"""

          new = """      player=p;if(cg!=='CG02')installHighQualityRenderer(p);else{
        // CG02 has two separate genital shadow meshes. The lower/right one is
        // visible in the early actions, but the upper/left LP shadow is keyed
        // to alpha 0 in Action_00-03. In the browser renderer that leaves the
        // upper-left area looking unnaturally washed out. Keep the original
        // Multiply material and restore that shadow only for those actions.
        for(const n of ['LP_penis_shadow','RP_penis_shadow']){
          try{const s=p.skeleton.findSlot(n);if(s&&s.data&&spine.BlendMode)s.data.blendMode=spine.BlendMode.Multiply}catch(e){}
        }
        try{
          const lp=p.skeleton.findSlot('LP_penis_shadow');
          const si=lp&&lp.data?lp.data.index:-1;
          if(si>=0){
            for(const a of (p.skeleton.data.animations||[])){
              if(!['Action_00','Action_01','Action_02','Action_03'].includes(a.name))continue;
              for(const tl of (a.timelines||[])){
                const ids=tl&&tl.propertyIds||[];
                if(tl&&tl.slotIndex===si&&tl.frames&&ids.some(id=>String(id)==='9|'+si)){
                  const step=(typeof tl.getFrameEntries==='function')?tl.getFrameEntries():5;
                  for(let j=step-1;j<tl.frames.length;j+=step)tl.frames[j]=1;
                }
              }
            }
          }
        }catch(e){console.warn('CG02 LP shadow timeline fix failed',e)}
      }"""

          if new in html:
              print('Upper-left shadow patch already present')
          elif old in html:
              html = html.replace(old, new, 1)
          else:
              raise RuntimeError('CG02 success callback anchor not found')

          html = html.replace('20260908-multiply-shadow-v1', '20260908-upper-left-shadow-v2')
          p.write_text(html, encoding='utf-8')

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "Restore CG02 upper-left shadow in early actions"
          git push
