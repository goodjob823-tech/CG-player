<title>Succubus Successor CG01-05 Player</title>
<style>
html,body{margin:0;height:100%;background:#090b10;color:#eef2f7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%}
#topbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 12px;background:#171a21;border-bottom:1px solid #2a2f39;transition:transform .2s ease,opacity .2s ease;z-index:30}
body.ui-hidden #topbar{transform:translateY(-115%);opacity:0;pointer-events:none;position:absolute;left:0;right:0;top:0}
#topbar .group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
#topbar button,#topbar select{background:#222834;color:#eef2f7;border:1px solid #394050;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
#topbar button:hover,#topbar select:hover{background:#293141}
#topbar button.active{background:#39599b;border-color:#5f86d9}
#hud{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:14px;opacity:.96}
#cgName,#actionName{font-weight:700}
#stage{position:relative;flex:1;outline:none;overflow:hidden;background:#0b0d12;cursor:grab;touch-action:none}
#stage.dragging{cursor:grabbing}
#bgLayer{position:absolute;inset:0;z-index:0;overflow:hidden;background:#0b0d12;pointer-events:none}
#bgImage{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
#characterViewport{position:absolute;inset:0;z-index:1;transform-origin:0 0;will-change:transform}
#playerWrap{position:absolute;inset:0;background:transparent}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(9,12,18,.48);z-index:20;backdrop-filter:blur(2px)}
#hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:8px 12px;background:rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.14);border-radius:999px;font-size:13px;opacity:.75;pointer-events:none;transition:opacity .5s;z-index:21;white-space:nowrap}
#error{max-width:min(92vw,900px);padding:16px 18px;border-radius:12px;background:#3d1820;color:#ffdfe6;border:1px solid #7b3142;white-space:pre-wrap}
#showUiBtn{position:absolute;right:12px;top:12px;z-index:40;display:none;background:rgba(20,24,32,.82);color:#eef2f7;border:1px solid #485266;border-radius:999px;padding:8px 12px;cursor:pointer;backdrop-filter:blur(3px)}
body.ui-hidden #showUiBtn{display:block}
.kbd{padding:2px 7px;border-radius:7px;background:#232937;border:1px solid #40495c;font-size:12px}

/* Mobile enhancement patch */
:root{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}
#mobileToolbar{display:none;position:absolute;left:max(10px,var(--safe-left));right:max(10px,var(--safe-right));bottom:max(10px,var(--safe-bottom));z-index:35;background:rgba(18,22,30,.88);border:1px solid rgba(255,255,255,.10);border-radius:16px;backdrop-filter:blur(8px);padding:10px 10px calc(10px + var(--safe-bottom)*0);box-shadow:0 8px 24px rgba(0,0,0,.28)}
#mobileToolbar .row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:0 0 8px}#mobileToolbar .row:last-child{margin-bottom:0}#mobileToolbar button,#mobileToolbar select{background:#222834;color:#eef2f7;border:1px solid #394050;border-radius:12px;padding:12px 14px;font-size:16px;line-height:1;min-height:44px;cursor:pointer}#mobileToolbar button.compact{padding:10px 12px;min-width:44px}#mobileToolbar button.wide{min-width:92px}#mobileToolbar button.active{background:#39599b;border-color:#5f86d9}#mobileToolbar .spacer{flex:1 1 auto}#mobileToolbar .cgpicker{min-width:110px;max-width:46vw}
@media (pointer:coarse),(max-width:900px){
  html,body{overscroll-behavior:none}
  #topbar{padding:calc(10px + var(--safe-top)) max(12px,var(--safe-right)) 10px max(12px,var(--safe-left));gap:10px;max-height:52dvh;overflow:auto;align-content:flex-start}
  #topbar .group{width:100%}
  #topbar button,#topbar select,#topbar label{font-size:16px}
  #topbar button,#topbar select{min-height:44px;padding:10px 12px}
  #topbar label input[type=range]{width:min(42vw,220px)!important}
  #hud{width:100%;font-size:13px;gap:10px}
  #showUiBtn{top:calc(10px + var(--safe-top));right:max(12px,var(--safe-right));padding:10px 14px;font-size:16px}
  #hint{left:12px;right:12px;bottom:calc(12px + var(--safe-bottom));transform:none;white-space:normal;text-align:center;padding:10px 12px;font-size:13px}
  #mobileToolbar{display:none!important}
  body.ui-hidden #mobileToolbar{display:none!important}
  #stage{padding-bottom:0}
}
@media (pointer:coarse) and (orientation:portrait){
  #hint{bottom:calc(12px + var(--safe-bottom))}
}

/* PWA app-like enhancement */
body.standalone-mode #topbar{padding-top:calc(10px + env(safe-area-inset-top,0px))}
#installFab{position:absolute;left:max(12px,env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:41;background:rgba(57,89,155,.92);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:10px 14px;font-size:15px;cursor:pointer;display:none;backdrop-filter:blur(8px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
#installFab.show{display:block}
#installHint{position:absolute;left:12px;right:12px;top:calc(58px + env(safe-area-inset-top,0px));z-index:41;display:none;background:rgba(17,20,27,.96);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#installHint.show{display:block}
#installHint strong{display:block;margin-bottom:4px}
#installHint .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
#installHint button{background:#222834;color:#eef2f7;border:1px solid #394050;border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
body.standalone-mode #installFab, body.standalone-mode #installHint{display:none!important}
@media (pointer:coarse),(max-width:900px){#installFab{font-size:16px;padding:11px 15px}}
</style>

<div id="app">
  <div id="topbar">

      <button id="prevCGBtn">上一個 CG</button>

    <div class="group">
      <button id="prevBtn">上一個動作</button>

      <button id="modeBtn">模式：手動</button>
      <button id="resetViewBtn">重置縮放 / 位置</button>
      <button id="saveViewBtn">保存目前縮放 / 位置</button>
      <button id="loadViewBtn">讀取保存位置</button>
      <button id="audioBtn">聲音：開</button>
      <label style="display:flex;align-items:center;gap:6px">音量 <input id="volumeSlider" type="range" min="0" max="100" value="85" style="width:110px"></label>
      <button id="fullscreenBtn">全螢幕</button>
      <button id="hideUiBtn">隱藏 UI</button>
      <button id="reloadBtn">重載</button>
    </div>
    <div id="hud">
      <span>CG：<span id="cgName">-</span></span>
      <span>動作：<span id="actionName">-</span></span>
      <span id="counter">0 / 0</span>
      <span id="zoomInfo">縮放：100%</span>
    </div>
  </div>

    <div id="bgLayer"><img id="bgImage" alt="背景"></div>
    <div id="characterViewport"><div id="playerWrap"></div></div>
    <div id="loading">載入中…</div>
    <button id="showUiBtn" type="button">顯示 UI</button>
    <button id="installFab" type="button">安裝 App</button>
    <div id="installHint" role="dialog" aria-live="polite">
      <strong>把播放器加入主畫面</strong>
      <div id="installHintText">Android 可直接安裝；iPhone / iPad 請在 Safari 點分享，再選「加入主畫面」。</div>
      <div class="actions"><button id="installHintClose" type="button">知道了</button></div>
    </div>
    <div id="hint">滾輪：游標中心縮放　/　左鍵點一下：下一個動作　/　右鍵：上一個動作　/　左鍵拖曳：移動角色　/　<span class="kbd">L</span> 讀取保存位置　/　<span class="kbd">M</span> 靜音　/　<span class="kbd">R</span> 重置　/　<span class="kbd">←</span><span class="kbd">→</span> 動作　/　<span class="kbd">↑</span><span class="kbd">↓</span> CG　/　<span class="kbd">H</span> UI</div>

<script>
/* Mobile UI + gesture enhancement patch */
(function(){
  const mobileLike = window.matchMedia('(pointer:coarse), (max-width:900px)').matches;
  const stageEl = document.getElementById('stage');
  if(!stageEl) return;

  const hintEl = document.getElementById('hint');
  if (hintEl && mobileLike) {
    hintEl.textContent = '手機操作：點一下＝下一個動作／長按拖曳＝移動／雙指開合＝縮放／需要操作時按右上角「顯示 UI」';
  }

  const toolbar = document.createElement('div');
  toolbar.id = 'mobileToolbar';
  toolbar.innerHTML = `
    <div class="row">
      <button id="mPrevCG" class="compact" type="button">CG◀</button>
      <select id="mCgSelect" class="cgpicker" aria-label="選擇 CG"></select>
      <button id="mNextCG" class="compact" type="button">▶CG</button>
      <button id="mMenu" class="wide" type="button">選單</button>
    </div>
    <div class="row">
      <button id="mPrev" class="compact" type="button">◀</button>
      <button id="mPause" class="wide" type="button">播放/暫停</button>
      <button id="mNext" class="compact" type="button">▶</button>
      <button id="mAuto" class="wide" type="button">自動</button>
      <button id="mAudio" class="wide" type="button">聲音</button>
    </div>
    <div class="row">
      <button id="mReset" class="wide" type="button">重置視角</button>
      <button id="mSave" class="compact" type="button">存</button>
      <button id="mLoad" class="compact" type="button">讀</button>
      <button id="mFullscreen" class="wide" type="button">全螢幕</button>
      <button id="mHideUI" class="wide" type="button">隱藏 UI</button>
    </div>`;
  stageEl.appendChild(toolbar);
  toolbar.style.display = 'none';

  const mCgSelect = document.getElementById('mCgSelect');
  if (typeof CG_ORDER !== 'undefined' && mCgSelect) {
    for (const cg of CG_ORDER) {
      const o = document.createElement('option');
      o.value = cg;
      o.textContent = cg;
      mCgSelect.appendChild(o);
    }
  }

  if (typeof changeCG === 'function') {
    document.getElementById('mPrevCG').addEventListener('click', ()=>changeCG(-1));
    document.getElementById('mNextCG').addEventListener('click', ()=>changeCG(1));
  }
  if (mCgSelect && typeof loadCG === 'function') mCgSelect.addEventListener('change', ()=>{ currentActionIndex = 0; loadCG(mCgSelect.value); });
  if (typeof setUiHidden === 'function') document.getElementById('mMenu').addEventListener('click', ()=>setUiHidden(!uiHidden));
  if (typeof prevAction === 'function') document.getElementById('mPrev').addEventListener('click', ()=>prevAction());
  if (typeof togglePause === 'function') document.getElementById('mPause').addEventListener('click', ()=>togglePause());
  if (typeof nextAction === 'function') document.getElementById('mNext').addEventListener('click', ()=>nextAction());
  if (typeof toggleAutoMode === 'function') document.getElementById('mAuto').addEventListener('click', ()=>toggleAutoMode());
  if (typeof toggleAudioMute === 'function') document.getElementById('mAudio').addEventListener('click', ()=>{ if(typeof unlockAudio==='function') unlockAudio(); toggleAudioMute(); });
  if (typeof resetView === 'function') document.getElementById('mReset').addEventListener('click', ()=>resetView());
  if (typeof saveCurrentView === 'function') document.getElementById('mSave').addEventListener('click', ()=>saveCurrentView());
  if (typeof loadCurrentSavedView === 'function') document.getElementById('mLoad').addEventListener('click', ()=>loadCurrentSavedView());
  if (typeof toggleFullscreen === 'function') document.getElementById('mFullscreen').addEventListener('click', ()=>toggleFullscreen());
  if (typeof setUiHidden === 'function') document.getElementById('mHideUI').addEventListener('click', ()=>setUiHidden(true));

  if (mobileLike) {
    try { volumeSlider.style.width = 'min(42vw, 220px)'; } catch(e){}
    try { setUiHidden(true); } catch(e){}
  }
})();
</script>

(function(){
  const inStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  if (inStandalone) document.body.classList.add('standalone-mode');
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(err){ console.warn('SW register failed', err); });
    });
  }
})();
